plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The build number comes from CI, so every build carries a version of its own;
// building by hand falls back to 1 / 1.0.
def buildCode = (project.findProperty('verCode') ?: '1') as Integer
def buildName = (project.findProperty('verName') ?: '1.0') as String

android {
    namespace 'com.dalail.rahamat'
    // Android 16. Google Play requires new apps and updates to target it.
    compileSdk 36

    defaultConfig {
        applicationId "com.dalail.rahamat"
        minSdk 21
        targetSdk 36
        versionCode buildCode
        versionName buildName

    }

    signingConfigs {
        // One fixed key for every build. The generated debug key is made anew
        // on each machine and each CI run, and Android refuses to install a
        // package over one signed by a different key — so without this, every
        // new build has to be uninstalled before it can be put on.
        shared {
            storeFile file('../dalail-shared.keystore')
            storePassword 'dalailapp'
            keyAlias 'dalailkey'
            keyPassword 'dalailapp'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    androidResources {
        // The leaves are WebP already; zipping them again only slows the build
        // and the first read of each page.
        noCompress.add('webp')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    // The leaves are turned in a pager, which is what gives them their
    // right-to-left order without a line of code asking for it.
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
