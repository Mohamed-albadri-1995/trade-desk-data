name: Build PDF Book App

# Builds the Android app into an installable .apk automatically.
# Runs on every push to the app branch, and can be started by hand from the
# Actions tab (the "Run workflow" button).

on:
  push:
    branches: [ "claude/android-pdf-book-app-tz6hcp" ]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # Downloads the book onto the build server and bundles it into the app.
      # The link lives in android-app/BOOK_PDF_URL.txt (one line). Supports
      # Google Drive, Dropbox, and any direct-download link. If the file is
      # missing or empty, the app still builds (without a book).
      - name: Fetch the PDF book
        run: |
          set -e
          URL_FILE="android-app/BOOK_PDF_URL.txt"
          DEST="android-app/app/src/main/assets/book.pdf"
          if [ ! -s "$URL_FILE" ]; then
            echo "No BOOK_PDF_URL.txt found — building the app without a bundled book."
            exit 0
          fi
          URL="$(head -n1 "$URL_FILE" | tr -d '[:space:]')"
          echo "Configured link: $URL"
          pip install --quiet --upgrade gdown
          mkdir -p _bookdl
          if echo "$URL" | grep -q "drive.google.com/drive/folders/"; then
            echo "Detected a Google Drive FOLDER link — downloading its contents..."
            gdown --folder "$URL" -O _bookdl
          elif echo "$URL" | grep -q "drive.google.com"; then
            echo "Detected a Google Drive FILE link..."
            FILEID="$(echo "$URL" | sed -nE 's#.*/d/([^/]+).*#\1#p; s#.*[?&]id=([^&]+).*#\1#p' | head -n1)"
            gdown --id "$FILEID" -O _bookdl/book.pdf
          else
            echo "Treating as a direct download link..."
            URL="$(echo "$URL" | sed 's/dl=0/dl=1/; s#www\.dropbox\.com#dl.dropboxusercontent.com#')"
            curl -L --fail -o _bookdl/book.pdf "$URL"
          fi
          # Pick the first PDF from whatever was downloaded (the folder also has images).
          PDF="$(find _bookdl -type f -iname '*.pdf' | head -n1)"
          if [ -z "$PDF" ]; then
            echo "::error::No PDF found at the link. Make sure the Drive folder is shared as 'Anyone with the link' and the PDF finished uploading."
            exit 1
          fi
          cp "$PDF" "$DEST"
          if [ ! -s "$DEST" ] || [ "$(head -c 4 "$DEST")" != "%PDF" ]; then
            echo "::error::The downloaded file is not a valid PDF."
            exit 1
          fi
          echo "Book ready: $(basename "$PDF") -> book.pdf ($(du -h "$DEST" | cut -f1))"
          # Diagnostic: print page count and the built-in table of contents (chapters),
          # so we can wire the side navigation menu to the book's own sections.
          pip install --quiet pypdf
          python3 - "$DEST" <<'PY'
          import sys
          from pypdf import PdfReader
          r = PdfReader(sys.argv[1])
          print("PAGES:", len(r.pages))
          def walk(items, depth=0):
              for it in items:
                  if isinstance(it, list):
                      walk(it, depth + 1)
                  else:
                      try:
                          pg = r.get_destination_page_number(it) + 1
                      except Exception:
                          pg = "?"
                      print("TOC " + "  " * depth + "p%s | %s" % (pg, it.title))
          try:
              ol = r.outline
              if ol:
                  walk(ol)
              else:
                  print("NO_OUTLINE: the PDF has no embedded chapter marks.")
          except Exception as e:
              print("NO_OUTLINE:", e)
          PY

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-book-app
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (easy public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: PDF Book App (latest build)
          body: >
            The installable app is attached below as **app-debug.apk**.
            Download it onto an Android phone and tap it to install
            (allow "install from unknown sources" if prompted).
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
