name: Build Dalail App

# Builds دلائل الرحمات into an installable .apk, checks the package is sound,
# and then actually runs it on an emulator — old Android and new — so that
# «it works on modern devices» is something seen rather than assumed.

on:
  push:
    branches: [ "claude/android-pdf-book-app-tz6hcp" ]
    paths:
      - "dalail-app/**"
      - ".github/workflows/build-dalail.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # Output is teed to a file as well as the console, so a failure can be
      # read back from the artifact below when the job log is not reachable.
      - name: Build debug APK
        working-directory: dalail-app
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PverCode=${{ github.run_number }} \
            -PverName=1.0.${{ github.run_number }} 2>&1 | tee ../build-debug.log

      # Lint is told to look, and its report is kept, but it does not fail the
      # build: it reports style alongside substance, and the substance that
      # matters here is checked by name in the next step.
      - name: Run lint
        working-directory: dalail-app
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon 2>&1 | tail -60

      # Each of these has broken an install or a screen before, so each is
      # asked about by name and the step fails if the answer is wrong.
      - name: Check the package is sound
        run: |
          set -euo pipefail
          APK=dalail-app/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          ls -la "$APK"

          echo "═══ what the package says it is ═══"
          "$TOOLS/aapt2" dump badging "$APK" | grep -E \
            "^package|sdkVersion|targetSdkVersion|native-code|uses-permission" || true

          echo "═══ resources.arsc must be stored, not deflated ═══"
          # Android 11 and later refuse to install a package whose resource
          # table is compressed — this was the «problem parsing the package».
          if unzip -lv "$APK" | grep -E "resources\.arsc" | grep -qv "Stored"; then
            echo "FAIL: resources.arsc is compressed"; exit 1
          fi
          unzip -lv "$APK" | grep "resources.arsc"

          echo "═══ no native code ═══"
          # Nothing to go wrong on a 16 KB page-size device, and nothing to be
          # missing for an architecture — the whole book is assets and Kotlin.
          if unzip -l "$APK" | grep -q " lib/"; then
            echo "FAIL: the package carries native libraries"; exit 1
          fi
          echo "none"

          echo "═══ signatures ═══"
          # v2 at least: Android 11+ will not install a v1-only package on a
          # modern device. The certificate digest is printed so it can be
          # compared between builds — the same digest means an update installs
          # over the previous copy instead of being refused.
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/sig.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sig.txt \
            || { echo "FAIL: not v2-signed"; exit 1; }

          echo "═══ alignment, including the 16 KB pages of new devices ═══"
          "$TOOLS/zipalign" -c -v -P 16 4 "$APK" | tail -3

      - name: Keep the build output when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dalail-build-failure-log
          path: |
            build-debug.log
            dalail-app/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalail-app
          path: dalail-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (easy public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dalail-latest
          name: دلائل الرحمات — بناء ${{ github.run_number }}
          body: >
            الإصدار: 1.0.${{ github.run_number }} (بناء ${{ github.run_number }}).
            نزّل **app-debug.apk** بالأسفل وثبّته فوق النسخة القديمة.
          files: dalail-app/app/build/outputs/apk/debug/app-debug.apk

  # Installs the book on a real Android image and opens it. Android 16 is the
  # newest and the one the app targets — where the window is drawn behind the
  # system bars — and Android 7 stands for the old end of what it supports.
  run-on-emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [ 24, 36 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dalail-app
          path: apk

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install, open the book, and look at it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb logcat -c
            adb install -r apk/app-debug.apk
            adb shell am start -W -n com.dalail.rahamat/.MainActivity
            sleep 12

            echo "═══ is the book the activity on screen? ═══"
            adb shell dumpsys activity activities \
              | grep -E "mResumedActivity|topResumedActivity" | tee /tmp/top.txt
            grep -q "com.dalail.rahamat" /tmp/top.txt \
              || { echo "FAIL: the book is not the activity on screen"; exit 1; }

            echo "═══ did anything crash or go wrong? ═══"
            adb logcat -d > /tmp/logcat.txt || true
            grep -E "FATAL EXCEPTION|ANR in com.dalail|Force finishing" /tmp/logcat.txt \
              && { echo "FAIL: see above"; exit 1; } || echo "nothing"
            grep -iE "com.dalail.rahamat|dalail" /tmp/logcat.txt | tail -40 || true

            echo "═══ turn a leaf, open the index, press back ═══"
            adb shell input swipe 200 900 800 900 300   # a leaf, right to left
            sleep 2
            adb shell input swipe 1000 900 200 900 300  # and back again
            sleep 2
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell dumpsys activity activities \
              | grep -E "mResumedActivity|topResumedActivity" || true

            adb exec-out screencap -p > /tmp/opened.png
            adb logcat -d > /tmp/logcat-after.txt || true
            grep -E "FATAL EXCEPTION" /tmp/logcat-after.txt \
              && { echo "FAIL: crashed while being used"; exit 1; } || echo "no crash"
            mkdir -p shot && cp /tmp/opened.png /tmp/logcat-after.txt shot/

      - name: Keep the screenshot and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dalail-on-android-${{ matrix.api }}
          path: shot
          if-no-files-found: warn
