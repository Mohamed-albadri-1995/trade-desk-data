name: Build Dalail App

# Builds the دلائل الرحمات text-reader app into an installable .apk.

on:
  push:
    branches: [ "claude/android-pdf-book-app-tz6hcp" ]
    paths:
      - "dalail-app/**"
      - ".github/workflows/build-dalail.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # Output is teed to a file as well as the console, so a failure can be
      # read back from the artifact below when the job log is not reachable.
      - name: Build debug APK
        working-directory: dalail-app
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PverCode=${{ github.run_number }} \
            -PverName=1.0.${{ github.run_number }} 2>&1 | tee ../build-debug.log

      # The previous package would not install — «There was a problem parsing
      # the package» — and nothing could be seen wrong in it by hand, so the
      # real tools are asked here and their answer kept with the build.
      - name: Check the package is sound
        run: |
          set -o pipefail
          APK=dalail-app/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          ls -la "$APK"
          echo "=== badging ==="
          "$TOOLS/aapt2" dump badging "$APK" | head -30
          echo "=== signatures ==="
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "=== alignment ==="
          "$TOOLS/zipalign" -c -v -P 16 4 "$APK" | tail -5 || \
            "$TOOLS/zipalign" -c 4 "$APK"

      - name: Keep the build output when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dalail-build-failure-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalail-app
          path: dalail-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (easy public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dalail-latest
          name: دلائل الرحمات — بناء ${{ github.run_number }}
          body: >
            الإصدار: 1.0.${{ github.run_number }} (بناء ${{ github.run_number }}).
            نزّل **app-debug.apk** بالأسفل وثبّته فوق النسخة القديمة.
          files: dalail-app/app/build/outputs/apk/debug/app-debug.apk
