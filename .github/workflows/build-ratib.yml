name: Build Ratib App

# Builds the راتب السعادة text-reader app into an installable .apk.

on:
  push:
    branches: [ "claude/android-pdf-book-app-tz6hcp" ]
    paths:
      - "ratib-app/**"
      - ".github/workflows/build-ratib.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # Output is teed to a file as well as the console, so a failure can be
      # read back from the artifact below when the job log is not reachable.
      - name: Build debug APK
        working-directory: ratib-app
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PverCode=${{ github.run_number }} \
            -PverName=1.0.${{ github.run_number }} 2>&1 | tee ../build-debug.log

      # The Play Store takes an .aab, signed with the release key.
      - name: Build release bundle for Google Play
        working-directory: ratib-app
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -PverCode=${{ github.run_number }} \
            -PverName=1.0.${{ github.run_number }} 2>&1 | tee ../build-release.log

      - name: Keep the build output when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build-debug.log
            build-release.log
          if-no-files-found: warn

      - name: Upload Play bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-aab
          path: ratib-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratib-saada-app
          path: ratib-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (easy public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ratib-latest
          name: راتب السعادة — بناء ${{ github.run_number }}
          body: >
            الإصدار: 1.0.${{ github.run_number }} (بناء ${{ github.run_number }}).
            نزّل **app-debug.apk** بالأسفل وثبّته فوق النسخة القديمة.
            تحقق من رقم الإصدار داخل التطبيق في شاشة الغلاف بالأسفل.
          files: |
            ratib-app/app/build/outputs/apk/debug/app-debug.apk
            ratib-app/app/build/outputs/bundle/release/app-release.aab

  # Installs the ratib on a real Android image and uses it. Android 16 is the
  # one Google Play now requires it to target — and where the window is drawn
  # behind the system bars — and Android 7 stands for the old end it supports.
  run-on-emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [ 24, 36 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ratib-saada-app
          path: apk

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install, open the ratib, and look at it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One line: the action runs each line of an inline script in a
          # shell of its own, so anything spanning two lines breaks.
          script: bash ratib-app/ci/smoke.sh apk/app-debug.apk shot

      - name: Keep the screenshot and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratib-on-android-${{ matrix.api }}
          path: shot
          if-no-files-found: warn
