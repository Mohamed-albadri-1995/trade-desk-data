name: Build Ratib App

# Builds the راتب السعادة text-reader app into an installable .apk.

on:
  push:
    branches: [ "claude/android-pdf-book-app-tz6hcp" ]
    paths:
      - "ratib-app/**"
      - ".github/workflows/build-ratib.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ratib-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratib-saada-app
          path: ratib-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (easy public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ratib-latest
          name: راتب السعادة (latest build)
          body: >
            التطبيق مرفق بالأسفل باسم **app-debug.apk**. نزّله على هاتف أندرويد
            واضغط عليه للتثبيت (اسمح بالتثبيت من مصادر غير معروفة إذا طُلب).
          files: ratib-app/app/build/outputs/apk/debug/app-debug.apk
