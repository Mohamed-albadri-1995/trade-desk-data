pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // JitPack hosts the PDF viewer library used to display the book.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "PdfBook"
include ':app'
