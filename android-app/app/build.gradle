plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pdfbook.reader'
    compileSdk 35

    defaultConfig {
        applicationId "com.pdfbook.reader"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // Keep it simple for a first build: no code shrinking.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // PDF rendering: continuous scroll, pinch-to-zoom, double-tap zoom, page jump.
    // Maintained fork of the classic barteksc/AndroidPdfViewer library.
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'
}
