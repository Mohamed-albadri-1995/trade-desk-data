plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ratib.saada'
    compileSdk 35

    defaultConfig {
        // The app's permanent identity on Google Play, and what appears in its
        // store URL. Fixed before the first upload, because it can never be
        // changed afterwards. The Kotlin package above is only internal.
        applicationId "com.sammaniyya.awrad"
        minSdk 21
        targetSdk 35
        // Rises with each CI build so installing over the old app counts as an update.
        versionCode ((project.findProperty('verCode') ?: '1').toString().toInteger())
        versionName ((project.findProperty('verName') ?: '1.0').toString())
    }

    signingConfigs {
        // Test builds. Fixed so a new APK installs over the previous one instead
        // of being refused for a changed signature.
        shared {
            storeFile file('../ratib-debug.keystore')
            storePassword 'ratibapp'
            keyAlias 'ratibkey'
            keyPassword 'ratibapp'
        }
        // Play Store builds. Google ties the listing to this key permanently:
        // once uploaded, a lost keystore cannot be replaced without starting a
        // new listing, so ratib-release.keystore must be kept safe.
        release {
            storeFile file(project.findProperty('releaseStore') ?: '../ratib-release.keystore')
            storePassword project.findProperty('releaseStorePass') ?: 'ratibrelease'
            keyAlias project.findProperty('releaseKeyAlias') ?: 'ratibrelease'
            keyPassword project.findProperty('releaseKeyPass') ?: 'ratibrelease'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
