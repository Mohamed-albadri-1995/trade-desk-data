plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ratib.saada'
    compileSdk 35

    defaultConfig {
        applicationId "com.ratib.saada"
        minSdk 21
        targetSdk 35
        // Rises with each CI build so installing over the old app counts as an update.
        versionCode ((project.findProperty('verCode') ?: '1').toString().toInteger())
        versionName ((project.findProperty('verName') ?: '1.0').toString())
    }

    // A fixed key committed with the project. Without it every CI run generated
    // a throw-away debug key, so each APK had a different signature and Android
    // refused to install it over the previous one ("App not installed") — the
    // phone silently kept running the old build.
    signingConfigs {
        shared {
            storeFile file('../ratib-debug.keystore')
            storePassword 'ratibapp'
            keyAlias 'ratibkey'
            keyPassword 'ratibapp'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
